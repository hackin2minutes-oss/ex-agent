name: Exploitability Analysis
description: >
  Reports whether vulnerable dependency code is reachable from the application,
  separating reachability from exploitability preconditions.
inputs:
  project-dir:
    description: Project root to analyse, relative to the workspace
    default: "."
  deps:
    description: >
      Resolved dependency file produced by the build tool (for example
      maven-tree.txt, gradle-deps.txt, package-lock.json or requirements.txt).
      Default: first known file in the project.
    required: false
    default: ""
  rules-dir:
    description: Directory of curated vulnerability rules
    default: "rules"
  output-dir:
    description: Where reports are written
    default: "exploitability-report"
  fail-on:
    description: "confirmed_reachable (default) or confirmed_exploitable"
    default: "confirmed_reachable"
  policy-file:
    description: "Policy file (YAML). When set, it decides the gate instead of fail-on."
    required: false
    default: ""
  offline:
    description: Skip OSV, EPSS, KEV and fix-commit lookups
    default: "false"
  exposure:
    description: >
      Declared exposure of the analysed application: internet, internal or unknown.
      confirmed_exploitable is reported only when this is internet. The engine cannot
      establish exposure from source code.
    default: "unknown"
  update-dir:
    description: Signed update directory (manifest.json, manifest.json.sig and files). Empty to skip.
    required: false
    default: ""
  update-key:
    description: Path to the pinned publisher public key (Ed25519 PEM). Required when update-dir is set.
    required: false
    default: ""
  build-command:
    description: "Build command for the CodeQL database (default: CodeQL autobuild)"
    required: false
    default: ""
  fix-diffs-dir:
    description: Directory of <sha>.diff files used before fetching fix commits
    required: false
    default: ""
runs:
  using: docker
  image: Dockerfile
  args:
    - --project-dir
    - ${{ inputs.project-dir }}
    - --deps
    - ${{ inputs.deps }}
    - --rules-dir
    - ${{ inputs.rules-dir }}
    - --output-dir
    - ${{ inputs.output-dir }}
    - --fail-on
    - ${{ inputs.fail-on }}
    - --build-command
    - ${{ inputs.build-command }}
    - --update-dir
    - ${{ inputs.update-dir }}
    - --update-key
    - ${{ inputs.update-key }}
    - --fix-diffs-dir
    - ${{ inputs.fix-diffs-dir }}
    - --offline
    - ${{ inputs.offline }}
    - --policy
    - ${{ inputs.policy-file }}
    - --exposure
    - ${{ inputs.exposure }}
