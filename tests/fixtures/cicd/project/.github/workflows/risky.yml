name: risky
on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Greet
        run: echo "Thanks ${{ github.event.pull_request.title }}"
