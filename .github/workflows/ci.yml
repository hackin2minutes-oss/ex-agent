name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: PYTHONPATH=. python3 -P -m unittest discover -s tests -t . -v

  action:
    name: Action (Docker, offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # PR comment, same-repository pull requests only
      security-events: write # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@v4

      - name: Run the action
        id: exploitability
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          project-dir: tests/fixtures/app
          deps: tests/fixtures/app/maven-tree.txt
          rules-dir: rules
          output-dir: exploitability-report
          fail-on: confirmed_reachable
          offline: "true"

      - name: Verify report
        run: python3 -P scripts/verify_report.py exploitability-report --mode text_scan --expect-call-site

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('exploitability-report/findings.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: exploitability-report/findings.sarif
          category: exploitability-self-test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploitability-report-action
          path: exploitability-report/

  codeql:
    name: CodeQL call-site and taint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CodeQL CLI
        run: |
          curl -sSLf -o codeql-bundle.tar.gz \
            https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
          tar -xzf codeql-bundle.tar.gz
          ./codeql/codeql --version

      - name: Run engine with CodeQL
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/app \
            --deps tests/fixtures/app/maven-tree.txt \
            --rules-dir rules \
            --output-dir codeql-report \
            --codeql "$PWD/codeql/codeql" \
            --build-command "sh tests/fixtures/build.sh" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify CodeQL report
        run: python3 -P scripts/verify_report.py codeql-report --mode codeql --expect-call-site

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploitability-report-codeql
          path: codeql-report/
