name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install engine requirements
        run: python3 -m pip install --require-hashes -r requirements.lock
      - name: Check the dependency lock is current
        run: |
          python3 -m pip install "pip-tools==7.6.2"
          pip-compile --generate-hashes --allow-unsafe --strip-extras --quiet \
            --output-file "$RUNNER_TEMP/requirements.lock" requirements.txt
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' "$RUNNER_TEMP/requirements.lock")
      - name: Run unit tests
        run: PYTHONPATH=. python3 -P -m unittest discover -s tests -t . -v

  action:
    name: Action (Docker, offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # PR comment, same-repository pull requests only
      security-events: write # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the CI rule directory (production rules plus synthetic test rule)
        run: sh scripts/build_ci_rules.sh

      - name: Verify the image runs as non-root and can write the report
        run: |
          docker build -t exploitability-nonroot-check .
          uid=$(docker run --rm --entrypoint id exploitability-nonroot-check -u)
          echo "container uid: $uid"
          test "$uid" = "1001"
          mkdir -p "$RUNNER_TEMP/write-check"
          docker run --rm -v "$RUNNER_TEMP/write-check:/out" --entrypoint sh \
            exploitability-nonroot-check -c 'echo ok > /out/probe'
          test "$(cat "$RUNNER_TEMP/write-check/probe")" = "ok"

      - name: Run the action
        id: exploitability
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          project-dir: tests/fixtures/app
          deps: tests/fixtures/app/maven-tree.txt
          rules-dir: .ci-rules
          output-dir: exploitability-report
          fail-on: confirmed_reachable
          offline: "true"

      - name: Verify report
        run: python3 -P scripts/verify_report.py exploitability-report --mode text_scan --expect-call-site --expect-classification vulnerable_component_only

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('exploitability-report/findings.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: exploitability-report/findings.sarif
          category: exploitability-self-test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exploitability-report-action
          path: exploitability-report/

  codeql:
    name: CodeQL call-site and taint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the CI rule directory (production rules plus synthetic test rule)
        run: sh scripts/build_ci_rules.sh

      - name: Install CodeQL CLI
        run: |
          curl -sSLf -o codeql-bundle.tar.gz \
            https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
          tar -xzf codeql-bundle.tar.gz
          ./codeql/codeql --version

      - name: Install engine requirements
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Fetch Spring jars for the CodeQL build
        run: |
          mvn -B -q -f tests/fixtures/spring-classpath/pom.xml \
            dependency:copy-dependencies -DoutputDirectory="$RUNNER_TEMP/spring-libs"
          ls "$RUNNER_TEMP/spring-libs"

      - name: Run engine with CodeQL
        env:
          SPRING_LIBS: ${{ runner.temp }}/spring-libs
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/app \
            --deps tests/fixtures/app/maven-tree.txt \
            --rules-dir .ci-rules \
            --output-dir codeql-report \
            --codeql "$PWD/codeql/codeql" \
            --build-command "sh $PWD/tests/fixtures/build.sh" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify CodeQL report
        run: python3 -P scripts/verify_report.py codeql-report --mode codeql --expect-call-site --expect-classification reachable_preconditions_unknown

      - name: Run engine on the taint positive control
        env:
          SPRING_LIBS: ${{ runner.temp }}/spring-libs
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/taint-control \
            --deps tests/fixtures/taint-control/resolved-deps.json \
            --rules-dir .ci-rules \
            --output-dir codeql-control-report \
            --codeql "$PWD/codeql/codeql" \
            --build-command "sh $PWD/tests/fixtures/build.sh taint-control" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify taint positive control
        run: python3 -P scripts/verify_report.py codeql-control-report --mode codeql --expect-call-site --expect-taint confirmed --expect-classification reachable_preconditions_unknown

      - name: Run engine on the Python vulnerable app
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/python-app \
            --deps tests/fixtures/python-app/requirements.txt \
            --rules-dir .ci-rules \
            --output-dir codeql-python-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify Python vulnerable app
        run: python3 -P scripts/verify_report.py codeql-python-report --mode codeql --expect-call-site --expect-taint confirmed --expect-classification reachable_preconditions_unknown --expect-cve CVE-2017-18342

      - name: Run engine on the Python safe app
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/python-app-safe \
            --deps tests/fixtures/python-app-safe/requirements.txt \
            --rules-dir .ci-rules \
            --output-dir codeql-python-safe-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify Python safe app
        run: python3 -P scripts/verify_report.py codeql-python-safe-report --mode codeql --expect-classification not_reachable_within_analysed_scope --expect-cve CVE-2017-18342

      - name: Run engine on the JavaScript vulnerable app (gate must fail)
        run: |
          set +e
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/js-app \
            --deps tests/fixtures/js-app/package-lock.json \
            --rules-dir .ci-rules \
            --output-dir codeql-js-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --exposure internet \
            --offline true \
            --no-comment
          code=$?
          set -e
          echo "engine exit code: $code"
          test "$code" -eq 1

      - name: Verify JavaScript vulnerable app
        run: python3 -P scripts/verify_report.py codeql-js-report --mode codeql --expect-call-site --expect-taint confirmed --expect-classification confirmed_exploitable --expect-cve CVE-2019-10744 --expect-gate failed

      - name: Run engine on the JavaScript safe app (gate must pass)
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/js-app-safe \
            --deps tests/fixtures/js-app-safe/package-lock.json \
            --rules-dir .ci-rules \
            --output-dir codeql-js-safe-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify JavaScript safe app
        run: python3 -P scripts/verify_report.py codeql-js-safe-report --mode codeql --expect-classification not_reachable_within_analysed_scope --expect-cve CVE-2019-10744 --expect-gate passed

      - name: Run engine on the TypeScript app (gate must fail)
        run: |
          set +e
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/ts-app \
            --deps tests/fixtures/ts-app/package-lock.json \
            --rules-dir .ci-rules \
            --output-dir codeql-ts-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --exposure internet \
            --offline true \
            --no-comment
          code=$?
          set -e
          echo "engine exit code: $code"
          test "$code" -eq 1

      - name: Verify TypeScript app
        run: python3 -P scripts/verify_report.py codeql-ts-report --mode codeql --expect-call-site --expect-taint confirmed --expect-classification confirmed_exploitable --expect-cve CVE-2019-10744 --expect-gate failed

      - name: Run engine on the Go vulnerable app (gate must fail)
        run: |
          set +e
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/go-app \
            --deps tests/fixtures/go-app/go.sum \
            --rules-dir .ci-rules \
            --output-dir codeql-go-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --exposure internet \
            --offline true \
            --no-comment
          code=$?
          set -e
          echo "engine exit code: $code"
          test "$code" -eq 1

      - name: Verify Go vulnerable app
        run: python3 -P scripts/verify_report.py codeql-go-report --mode codeql --expect-call-site --expect-taint confirmed --expect-classification confirmed_exploitable --expect-cve CVE-2023-29401 --expect-gate failed

      - name: Run engine on the Go safe app (gate must pass)
        run: |
          PYTHONPATH=. python3 -P -m engine \
            --project-dir tests/fixtures/go-app-safe \
            --deps tests/fixtures/go-app-safe/go.sum \
            --rules-dir .ci-rules \
            --output-dir codeql-go-safe-report \
            --codeql "$PWD/codeql/codeql" \
            --fail-on confirmed_exploitable \
            --offline true \
            --no-comment

      - name: Verify Go safe app
        run: python3 -P scripts/verify_report.py codeql-go-safe-report --mode codeql --expect-call-site --expect-classification vulnerable_function_reachable --expect-cve CVE-2023-29401 --expect-gate passed
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exploitability-report-codeql
          path: codeql-report/
