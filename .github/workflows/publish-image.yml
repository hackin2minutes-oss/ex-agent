name: Publish engine image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, for example v0.1.0"
        required: true
        type: string
      codeql-version:
        description: "Optional CodeQL CLI release (for example 2.27.3). Adds a -codeql image tag."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and push ghcr.io image
    # Requires approval from the `production` environment's required reviewers.
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/exploitability-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version format
        run: |
          case "${{ inputs.version }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v0.1.0"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            CODEQL_VERSION=${{ inputs.codeql-version }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}${{ inputs.codeql-version != '' && '-codeql' || '' }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test the image
        run: |
          set -e
          TAG="${{ inputs.version }}${{ inputs.codeql-version != '' && '-codeql' || '' }}"
          docker run --rm "$IMAGE:$TAG" --help >/dev/null
          if [ -n "${{ inputs.codeql-version }}" ]; then
            docker run --rm --entrypoint codeql "$IMAGE:$TAG" version
          fi
