name: Publish engine image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and push ghcr.io image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/exploitability-agent
    steps:
      - uses: actions/checkout@v7

      - name: Check the version format
        run: |
          case "${{ inputs.version }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v0.1.0"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
